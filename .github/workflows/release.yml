name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # edge → Marketplace beta (current pom version, no tag/bump/merge)
      # release/vX.X.X → Stable Marketplace + full GitHub release flow
      - name: Resolve publish mode
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "edge" ]]; then
            VERSION="$(sed -n 's|^[[:space:]]*<version>\([^<]*\)</version>.*|\1|p' pom.xml | head -1)"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
              echo "Could not read a valid version from pom.xml (got: ${VERSION:-empty})" >&2
              exit 1
            fi
            echo "mode=edge" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Edge publish: version ${VERSION} → Marketplace beta"
          elif [[ "$BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "channel=" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Release publish: version ${VERSION} → Marketplace Stable"
          else
            echo "Run from edge (beta) or release/vMAJOR.MINOR.PATCH (Stable). Got: $BRANCH" >&2
            exit 1
          fi

      - name: Ensure tag does not already exist
        if: steps.meta.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-build

      - name: Bump version
        if: steps.meta.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/bump-version.sh "$VERSION"

      - name: Commit version bump
        if: steps.meta.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml server/pom.xml agent/pom.xml common/pom.xml build/pom.xml teamcity-plugin.xml README.md
          if git diff --staged --quiet; then
            echo "Version already at ${VERSION}; skipping commit"
          else
            git commit -m "Release ${VERSION}"
            git push
          fi

      - name: Create tag
        if: steps.meta.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin "v${VERSION}"

      - name: Build plugin zip
        run: mvn -B package

      - name: Create GitHub Release
        if: steps.meta.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="target/anka-build-cloud-teamcity-plugin-${VERSION}.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "Expected artifact missing: $ZIP" >&2
            ls -la target/ || true
            exit 1
          fi
          gh release create "v${VERSION}" "$ZIP" \
            --title "v${VERSION}" \
            --notes "Anka Build Cloud TeamCity plugin ${VERSION}."

      # pluginId 10733 — XML ID teamcity_<name> from teamcity-plugin.xml.
      # Requires repo secret JETBRAINS_MARKETPLACE_TOKEN.
      - name: Publish to JetBrains Marketplace
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          ZIP="target/anka-build-cloud-teamcity-plugin-${VERSION}.zip"
          if [[ -z "${JETBRAINS_MARKETPLACE_TOKEN}" ]]; then
            echo "Missing secret JETBRAINS_MARKETPLACE_TOKEN" >&2
            exit 1
          fi
          if [[ ! -f "$ZIP" ]]; then
            echo "Expected artifact missing: $ZIP" >&2
            ls -la target/ || true
            exit 1
          fi
          CURL_ARGS=(
            -sS
            --header "Authorization: Bearer ${JETBRAINS_MARKETPLACE_TOKEN}"
            -F pluginId=10733
            -F "file=@${ZIP}"
          )
          CHANNEL_LABEL="Stable"
          if [[ -n "${CHANNEL}" ]]; then
            CURL_ARGS+=(-F "channel=${CHANNEL}")
            CHANNEL_LABEL="${CHANNEL}"
          fi
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl "${CURL_ARGS[@]}" \
            -o "${RESPONSE_FILE}" -w "%{http_code}" \
            https://plugins.jetbrains.com/api/updates/upload)"
          RESPONSE_BODY="$(cat "${RESPONSE_FILE}")"
          echo "${RESPONSE_BODY}"
          if [[ "${HTTP_CODE}" =~ ^2 ]]; then
            echo "Published ${ZIP} to JetBrains Marketplace (plugin 10733, ${CHANNEL_LABEL})."
            exit 0
          fi
          # Re-runs / retries: version already on Marketplace should not fail the workflow.
          if echo "${RESPONSE_BODY}" | grep -Eiq \
            'already exists|already been uploaded|duplicate|same version|version .* exists'; then
            echo "Marketplace already has this version on ${CHANNEL_LABEL}; continuing."
            exit 0
          fi
          echo "Marketplace upload failed (HTTP ${HTTP_CODE})" >&2
          exit 1

      - name: Merge release into edge
        if: steps.meta.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin edge
          git checkout edge
          git pull --ff-only origin edge
          git merge --no-ff "release/v${VERSION}" -m "Merge release/v${VERSION} into edge"
          git push origin edge
