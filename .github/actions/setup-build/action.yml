name: Setup Java and Maven
description: Install Temurin Java and Maven 4 matching the project Docker/Jenkins image

inputs:
  java-version:
    description: Java version
    required: false
    default: "17"
  maven-version:
    description: Apache Maven version
    required: false
    default: "4.0.0-rc-5"

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven

    - name: Install Maven ${{ inputs.maven-version }}
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven-version }}
      run: |
        curl -fsSL "https://dlcdn.apache.org/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
          | tar -xz -C /tmp
        echo "/tmp/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
